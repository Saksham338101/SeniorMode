plugins {
    id 'com.android.application'
}

android {
    namespace 'com.appremtest'
    compileSdk 34

    defaultConfig {
    applicationId "com.appremtest"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
viewBinding{
    enabled true
}
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // For now compile to Java 17 bytecode to avoid lint and AGP tooling issues
        // while Gradle/AGP tooling catches up with Java 21 classfile support.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Prevent lint from failing the build during this upgrade iteration.
    // You can remove or tighten this later after addressing the lint issues
    // (or create a lint baseline with `gradlew updateLintBaseline`).
    lint {
        abortOnError false
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}